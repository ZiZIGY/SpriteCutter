    <title>SpriteCutter — нарезка спрайтов</title>
    <script>
      // Restores the path stashed by 404.html before the SPA router boots, so
      // a refresh on a deep link keeps the user on the same page.
      (function () {
        var search = window.location.search;
        var match = /[?&]redirect=([^&]*)/.exec(search);
        if (!match) return;
        var redirect = decodeURIComponent(match[1]);
        // Everything after the redirect param is the original query, with '&'
        // escaped as ~and~ by 404.html. Rebuild it as a raw string: parsing via
        // URLSearchParams would re-encode the separators into literal text.
        var rest = search
          .slice(match.index + match[0].length)
          .replace(/^&/, '')
          .replace(/~and~/g, '&');
        var base = window.location.pathname.replace(/\/$/, '');
        history.replaceState(
          null,
          '',
          base + redirect + (rest ? '?' + rest : '') + window.location.hash
        );
      })();
    </script>
