<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>SpriteCutter</title>
    <script>
      // GitHub Pages has no server-side rewrite, so a deep link like
      // /SpriteCutter/rig lands here. Stash the requested path in the query
      // string and bounce to index.html, which restores it via history API.
      (function () {
        var segments = 1; // repo name occupies the first path segment
        var location = window.location;
        var pathSegments = location.pathname
          .split('/')
          .slice(1 + segments)
          .join('/');
        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            location.pathname.split('/').slice(0, 1 + segments).join('/') +
            '/?redirect=/' +
            pathSegments +
            (location.search
              ? '&' + location.search.slice(1).replace(/&/g, '~and~')
              : '') +
            location.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
